<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💰 Wage Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#181b22;--bd:#2a2f3a;--tx:#e8eaf0;--mu:#8b93a5;--ac:#5eead4;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:4px 0 4px}.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:12px;color:var(--mu)}
input,textarea{width:100%;margin-top:3px;background:#0c0e12;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
button{background:var(--ac);color:#04201c;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:#262b36;color:var(--tx);font-weight:500}
button.i{background:none;color:var(--mu);padding:2px 8px;font-weight:400}button.x{background:none;color:var(--bad);padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tot{display:flex;justify-content:space-between;align-items:flex-end}.tot b{font-size:28px}.tot span{color:var(--mu);font-size:12px;display:block}
.wh{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.mu{color:var(--mu);font-size:13px}.ot{color:var(--warn)}
.sh{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding:5px 0;font-size:14px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
.res{font-size:13px;font-weight:600;margin-top:4px;min-height:18px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.alert{border-color:#5a2a2a;background:#201416}.alert.fine{border-color:#1f4a33;background:#121e18}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#0c0e12;margin:5px 0 3px}.bar i{display:block;height:100%}.bar .r{background:var(--ac)}.bar .o{background:var(--warn)}
.mrow{margin:12px 0 0}.mrow .mu b{color:var(--tx)}
details summary{cursor:pointer;color:var(--ac);font-weight:600}
</style></head><body><div class="w">
<h1>💰 Wage Tracker</h1>
<p class="sub">Up to 45 h/week at the normal rate, beyond that 1.5×. Shifts default to 3:00 pm start.</p>

<div class="card"><div class="wh"><span id="ft">Add shift</span></div>
<div class="g">
<label>Date<input type="date" id="d"></label>
<label>Start<input type="time" id="s" value="15:00"></label>
<label>Finish<input type="time" id="e" value="00:00"></label>
<label>Hourly rate (£)<input type="number" id="r" step="0.01" min="0" inputmode="decimal"></label>
<label>Unpaid break (min)<input type="number" id="b" step="1" min="0" inputmode="numeric"></label></div>
<div class="row"><button id="add">Add shift</button><button class="s" id="cancel" hidden>Cancel</button><span id="prev" class="mu"></span></div></div>

<div id="owed"></div>
<div class="card tot"><div><span>Total hours</span><b id="th">0</b></div><div style="text-align:right"><span>Total earned</span><b id="tp">0</b></div></div>
<div id="months"></div>
<div id="weeks"></div>

<div class="card"><details><summary>Backup &amp; restore</summary>
<div class="row"><button id="cp">Copy backup</button><button class="s" id="im">Import file</button><button class="s" id="ip">Import pasted</button></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<label style="margin-top:10px">Data (copy from here, or paste here to import)<textarea id="ta" rows="4"></textarea></label>
<div id="msg" class="mu" style="margin-top:6px"></div></details></div>
<p class="mu">Saved in this browser only. Back up now and then.</p>
</div>
<script>
const $=i=>document.getElementById(i),START='15:00',FIN='00:00',NORM=45,MULT=1.5,DEF=13.77;
let S={rate:DEF,brk:0,shifts:[],paid:{},hp:{}};
try{const x=JSON.parse(localStorage.getItem('wg2'));if(x&&x.shifts)S=Object.assign(S,x)}catch(_){}
if(!S.rate)S.rate=DEF;S.paid=S.paid||{};S.hp=S.hp||{};S.brk=S.brk||0;
let editId=null;
const save=()=>{try{localStorage.setItem('wg2',JSON.stringify(S))}catch(_){}};
const iso=t=>new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const money=n=>(n<0?'-':'')+'£'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const mins=t=>{const[a,b]=t.split(':');return a*60+ +b};
const span=(st,en,br)=>{let d=mins(en)-mins(st||START);if(d<=0)d+=1440;return Math.max(0,(d-(br||0))/60)};
const hrs=s=>span(s.start,s.end,s.brk);
const wk=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-(t.getUTCDay()+6)%7);return t.toISOString().slice(0,10)};
const fh=h=>(Math.round(h*100)/100).toString();
const pre=()=>{$('prev').textContent=span($('s').value,$('e').value||FIN,+$('b').value||0).toFixed(2)+' h this shift'};
['s','e','b'].forEach(i=>$(i).oninput=pre);
$('b').value=S.brk||'';$('r').value=S.rate||'';
$('r').oninput=()=>{S.rate=+$('r').value||0;save();render()};
$('b').addEventListener('change',()=>{if(!editId){S.brk=+$('b').value||0;save()}});
function resetForm(){editId=null;$('s').value=START;$('e').value=FIN;$('b').value=S.brk||'';$('r').value=S.rate||'';$('add').textContent='Add shift';$('ft').textContent='Add shift';$('cancel').hidden=true;pre()}
$('cancel').onclick=()=>{resetForm()};
$('add').onclick=()=>{if(!$('d').value||!$('s').value||!$('e').value)return;
 const o={id:editId||Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:$('d').value,start:$('s').value,end:$('e').value,brk:+$('b').value||0,rate:+$('r').value||0};
 const was=editId;
 if(editId)S.shifts=S.shifts.map(x=>x.id==editId?o:x);else S.shifts.push(o);
 if(!was)S.brk=o.brk;
 save();
 if(was){resetForm();$('d').value=today()}else{const n=new Date($('d').value+'T00:00:00');n.setDate(n.getDate()+1);$('d').value=iso(n)}
 render()};
function edit(id){const s=S.shifts.find(x=>x.id==id);if(!s)return;editId=id;
 $('d').value=s.date;$('s').value=s.start||START;$('e').value=s.end;$('b').value=s.brk||'';$('r').value=s.rate||S.rate||'';
 $('add').textContent='Save changes';$('ft').textContent='Edit shift';$('cancel').hidden=false;pre();scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('Delete this shift?')){S.shifts=S.shifts.filter(s=>s.id!=id);if(editId==id)resetForm();save();render()}}
function setPaid(k,v){if(v==='')delete S.paid[k];else S.paid[k]=+v;save();render()}
function setHp(k,v){if(v==='')delete S.hp[k];else S.hp[k]=+v;save();render()}
const rateOf=s=>s.rate||S.rate;
function render(){
 const W={};[...S.shifts].sort((a,b)=>(a.date+(a.start||START)).localeCompare(b.date+(b.start||START))).forEach(s=>{(W[wk(s.date)]=W[wk(s.date)]||[]).push(s)});
 let TH=0,TP=0,html='',oweSum=0,oweWeeks=0,hoursGap=0,missing=0,missingPay=0,over=0;
 Object.keys(W).sort().reverse().forEach(k=>{
  const L=W[k],h=L.reduce((a,s)=>a+hrs(s),0),n=Math.min(h,NORM),o=Math.max(0,h-NORM);
  // overtime premium goes to the latest hours of the week; each shift priced at its own rate
  let c=0,pay=0;L.forEach(s=>{const sh=hrs(s),r=Math.max(0,Math.min(sh,NORM-c));c+=sh;pay+=(r+(sh-r)*MULT)*rateOf(s)});
  TH+=h;TP+=pay;
  const p=S.paid[k],hp=S.hp[k],diff=p===undefined?null:pay-p,hg=hp===undefined?null:h-hp;
  if(diff===null){missing++;missingPay+=pay}else if(diff>0.005){oweSum+=diff;oweWeeks++}else if(diff<-0.005)over+=-diff;
  if(hg!==null&&hg>0.005)hoursGap+=hg;
  html+=`<div class="card"><div class="wh"><span>Week of ${k}</span><span>${money(pay)}</span></div>
  <div class="mu">${fh(h)} h${o?` · <span class="ot">${fh(o)} h overtime</span>`:''}</div>`+
  L.map(s=>`<div class="sh"><span>${s.date} · ${s.start||START}–${s.end}${s.brk?` · −${s.brk}m break`:''}</span><span>${fh(hrs(s))} h <button class="i" onclick="edit('${s.id}')">✎</button><button class="x" onclick="del('${s.id}')">✕</button></span></div>`).join('')+
  `<div class="pd"><div><label>Amount I was paid (£)<input type="number" step="0.01" inputmode="decimal" value="${p??''}" onchange="setPaid('${k}',this.value)"></label>
  <div class="res ${diff===null?'':diff>0.005?'bad':'ok'}">${diff===null?'':diff>0.005?'Owed '+money(diff):diff<-0.005?'Over-paid '+money(-diff):'✓ Correct'}</div></div>
  <div><label>Hours on payslip<input type="number" step="0.01" inputmode="decimal" value="${hp??''}" onchange="setHp('${k}',this.value)"></label>
  <div class="res ${hg===null?'':hg>0.005?'bad':'ok'}">${hg===null?'':hg>0.005?fh(hg)+' h unpaid':hg<-0.005?fh(-hg)+' h extra':'✓ Matches'}</div></div></div></div>`});
 // monthly regular vs overtime
 const M={};Object.values(W).forEach(L=>{let c=0;L.forEach(s=>{const h=hrs(s),r=Math.max(0,Math.min(h,NORM-c));c+=h;const m=s.date.slice(0,7);M[m]=M[m]||[0,0];M[m][0]+=r;M[m][1]+=h-r})});
 const mk=Object.keys(M).sort().reverse(),mx=Math.max(1,...mk.map(m=>M[m][0]+M[m][1]));
 $('months').innerHTML=mk.length?'<div class="card"><div class="wh"><span>Monthly hours</span><span class="mu">regular vs overtime</span></div>'+mk.map(m=>{const[r,o]=M[m];
  return `<div class="mrow"><div class="wh" style="margin:0"><span>${m}</span><span>${fh(r+o)} h</span></div><div class="bar"><i class="r" style="width:${r/mx*100}%"></i><i class="o" style="width:${o/mx*100}%"></i></div><div class="mu"><b>${fh(r)}</b> regular · <span class="ot"><b>${fh(o)}</b> overtime</span></div></div>`}).join('')+'</div>':'';
 // owed summary
 let ow='';
 if(Object.keys(W).length){
  const lines=[];
  if(oweWeeks)lines.push(`<div style="font-size:20px;font-weight:700" class="bad">You're owed ${money(oweSum)}</div><div class="mu">across ${oweWeeks} week${oweWeeks>1?'s':''}${hoursGap?` · ${fh(hoursGap)} h missing from payslips`:''}</div>`);
  else if(missing<Object.keys(W).length)lines.push(`<div style="font-size:18px;font-weight:700" class="ok">✓ No underpayment found${over?` (over-paid ${money(over)})`:''}</div>${hoursGap?`<div class="mu bad">${fh(hoursGap)} h missing from payslips</div>`:''}`);
  if(missing)lines.push(`<div class="mu" style="margin-top:6px">⚠️ ${missing} week${missing>1?'s have':' has'} no payment entered (${money(missingPay)} earned) — add it below to check.</div>`);
  ow=`<div class="card alert${oweWeeks?'':' fine'}">${lines.join('')}</div>`}
 $('owed').innerHTML=ow;
 $('weeks').innerHTML=html||'<div class="card mu">No shifts yet. Add one above.</div>';
 $('th').textContent=fh(TH);$('tp').textContent=money(TP)}
const json=()=>JSON.stringify(S);
function flash(t){$('msg').textContent=t}
$('cp').onclick=async()=>{$('ta').value=json();try{await navigator.clipboard.writeText(json());flash('Copied.')}catch(_){$('ta').select();flash('Copy the selected text manually.')}};
function imp(t){try{const x=JSON.parse(t);if(!Array.isArray(x.shifts))throw 0;
 if(!confirm('Replace current data with imported data?'))return;
 S={rate:x.rate||DEF,brk:x.brk||0,shifts:x.shifts,paid:x.paid||{},hp:x.hp||{}};save();resetForm();render();flash('Imported '+S.shifts.length+' shifts.')}catch(_){flash('Invalid data.')}}
$('im').onclick=()=>$('fi').click();
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f);e.target.value=''};
$('ip').onclick=()=>imp($('ta').value);
$('d').value=today();pre();render();
</script></body></html>
